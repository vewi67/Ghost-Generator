name: Build Ghost Generator

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PowerShell module
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
          Import-Module ps2exe

      - name: Build executable and package required ghost art
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Invoke-PS2EXE -InputFile .\Ghost-Generator.ps1 -OutputFile .\dist\Ghost-Generator.exe
          Copy-Item .\ghost.txt .\dist\ghost.txt
          Compress-Archive -Path .\dist\Ghost-Generator.exe, .\dist\ghost.txt -DestinationPath .\Ghost-Generator-Windows.zip -Force

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghost-Generator-Windows
          path: Ghost-Generator-Windows.zip
          if-no-files-found: error

      - name: Publish first public release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Ghost Generator v1.0.0
          target_commitish: main
          body: |
            The first public release of Ghost Generator.

            Download `Ghost-Generator-Windows.zip`, extract it, and keep `Ghost-Generator.exe` and `ghost.txt` together in the same folder.
            Run the executable on Windows, press Enter to start, and press Esc to stop creating ZIP files.
          files: Ghost-Generator-Windows.zip
          make_latest: true

      - name: Publish tagged release package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Ghost-Generator-Windows.zip
          generate_release_notes: true
